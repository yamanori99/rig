description = "Headless compute node — CLI runtimes, no GUI casks"
packages = ["common", "compute"]
default_shell = "bash"

[features]
gui = false
cursor = false
remote_login = true
# Remote Management (not the Screen Sharing switch). Turn on in System Settings once.
screen_sharing = true
# Off until the host opts in. Unrelated to `gui` / Tailscale.app.
tailscale = false
thunderbolt = true
stay_awake = true
