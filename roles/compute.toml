description = "Headless compute node — CLI runtimes, no GUI casks"
packages = ["common", "compute"]
default_shell = "bash"

[features]
gui = false
cursor = false
remote_login = true
# VNC :5900. Screen Sharing.app still needs a one-time System Settings toggle (macOS 12.1+).
screen_sharing = true
# Off until the host opts in. Unrelated to `gui` / Tailscale.app.
tailscale = false
thunderbolt = true
stay_awake = true
