description = "Laptop / workstation with GUI and full dev tooling"
packages = ["common", "workstation"]
default_shell = "zsh"

[features]
gui = true
cursor = true
remote_login = false
screen_sharing = false
tailscale = false
# Optional: [[ssh]] with link=thunderbolt puts this laptop on the TB bridge.
thunderbolt = true
stay_awake = false
