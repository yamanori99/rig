# Host example for role=compute.
# Copy via:  rig init --role compute
# Or copy this file to ../<name>.toml and edit.
#
# `name` is yours (inventory id). Pick SSH aliases yourself in [[ssh]].
# Real lab IPs belong only in your local hosts/*.toml (gitignored).
# Never commit real addresses to a shared repo.

name = "compute-01"
role = "compute"
schema_version = 1

# --- Identity (optional overrides) ---
# Omit os / shell to auto-detect at `rig apply` (recommended).
# os = "macos"          # or "linux"
# shell = "bash"        # or "zsh"
# user = "you"          # SSH / local account; default = current user

# --- Reachable paths (fill by hand) ---
# alias = whatever you want to type: `ssh <alias>`
# link  = vpn | lan | thunderbolt
#        (aliases: ts→vpn, tb→thunderbolt)
# thunderbolt link: on this machine, apply configures bridge0 + LaunchDaemon
#
# [[ssh]]
# alias = "mini-ts"
# ip = "100.x.x.x"
# link = "vpn"
#
# [[ssh]]
# alias = "mini-lan"
# ip = "192.168.x.x"
# link = "lan"
#
# [[ssh]]
# alias = "mini-tb"
# ip = "10.10.10.x"
# link = "thunderbolt"

# Legacy (still accepted): vpn/lan/thunderbolt = "ip"
# → auto aliases {name}-ts / {name}-lan / {name}-tb. Prefer [[ssh]].

# --- Package set tweaks (optional) ---
# [packages]
# add = ["julia"]
# remove = ["unwanted-set"]

# --- Feature overrides (optional; unset keys keep the role) ---
# [features]
# stay_awake = false
# screen_sharing = false   # daemon is :5900; Screen Sharing.app needs a GUI toggle once
# tailscale = true   # roles leave this off; Tailscale.app counts as installed
