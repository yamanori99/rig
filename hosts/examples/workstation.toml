# Host example for role=workstation (laptop / desktop).
# Copy via:  rig init --role workstation
# Or copy this file to ../<name>.toml and edit.
#
# `name` is yours (inventory id). SSH Host aliases are also yours via [[ssh]].
# rig never changes the OS hostname. For `rig apply` on this machine, keep
# `name` equal to the short hostname (or pass --name at init).
#
# To reach compute nodes, add *their* host files beside this one with [[ssh]]
# filled in, then:  rig apply

name = "my-laptop"
role = "workstation"
schema_version = 1

# --- Identity (optional overrides) ---
# Omit os / shell to auto-detect at `rig apply` (recommended).
# os = "macos"          # or "linux"
# shell = "zsh"         # or "bash"
# user = "you"          # default = current user

# --- Paths on THIS machine (optional) ---
# alias = SSH `Host` name (fully user-chosen)
# ip    = address on that path
# link  = vpn | lan | thunderbolt  (tb also configures bridge0 on apply)
#
# [[ssh]]
# alias = "air-tb"
# ip = "10.10.10.10"
# link = "thunderbolt"

# --- Package set tweaks (optional) ---
# [packages]
# add = ["extra-set"]
# remove = ["unwanted-set"]

# --- Feature overrides (optional; unset keys keep the role) ---
# [features]
# stay_awake = true
# screen_sharing = true
# tailscale = true   # roles leave this off; Tailscale.app counts as installed
