# Host example for role=workstation (laptop / desktop).
# Copy via:  rig init --role workstation
# Or copy this file to ../<name>.toml and edit.
#
# `name` is yours: inventory id and SSH Host prefix (<name>-lan / -tb / -ts).
# rig never changes the OS hostname. For `rig apply` on this machine, keep
# `name` equal to the short hostname (or pass --name at init).
#
# A workstation often has no vpn/lan/thunderbolt of its own.
# To SSH into compute nodes, add *their* host files beside this one
# (same directory), with each peer's vpn / lan / thunderbolt filled in.
# Then run:  rig apply   or   rig ssh-config --write
# → Host <peer>-ts / <peer>-lan / <peer>-tb

name = "my-laptop"
role = "workstation"
schema_version = 1

# --- Identity (optional overrides) ---
# Omit os / shell to auto-detect at `rig apply` (recommended).
# os = "macos"          # or "linux"
# shell = "zsh"         # or "bash"
# user = "you"          # default = current user

# --- Addresses on THIS machine (usually unused on a laptop) ---
# Only set if this workstation itself is reachable on that path.
# vpn = "100.x.x.x"
# lan = "192.168.x.x"
# thunderbolt = "10.10.10.x"

# --- Package set tweaks (optional) ---
# [packages]
# add = ["extra-set"]
# remove = ["unwanted-set"]
