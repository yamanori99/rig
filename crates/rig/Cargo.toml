[package]
name = "rig"
version = "0.2.13"
edition = "2021"
description = "Opinionated machine setup for workstation and compute hosts"
license = "MIT"

[[bin]]
name = "rig"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
miette = { version = "7", features = ["fancy"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
whoami = "1"
