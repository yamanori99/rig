# Product tmux defaults (both workstation and compute).
# Status scripts live under ~/.config/rig/tmux/scripts after apply.
# Override with overlay/tmux.conf when needed.

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status-position bottom
set -g status-style "bg=colour235 fg=colour250"
set -g status-left "#[fg=colour214,bold][#S] "
set -g status-left-length 48
# Prefer rig status scripts when present (macOS sysctl-based).
set -g status-right '#[fg=colour208]CPU:#(~/.config/rig/tmux/scripts/tmux-status.sh 2>/dev/null || echo -) #[fg=colour141]RAM:#(~/.config/rig/tmux/scripts/tmux-ram.sh 2>/dev/null || echo -) #[fg=colour250]| #[fg=colour70]#H #[fg=colour250]| #[fg=colour75]%Y-%m-%d %H:%M:%S'
set -g status-right-length 100
set -g status-interval 2

setw -g window-status-current-style "fg=colour214 bold"
setw -g window-status-style "fg=colour250"
set -g pane-border-style "fg=colour235"
set -g pane-active-border-style "fg=colour214"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.tmux.conf \; display-message "rig tmux reloaded"
